[project]
name = "ayuna-devops"
version = "0.1.0"
description = "Ayuna - devops utilities"
requires-python = ">=3.12,<3.14"
license-files = ["LICENSE"]
authors = [{ name = "Ayuna OSS", email = "foss@ayuna.io" }]
dependencies = []

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.workspace]
members = []

[[tool.uv.index]]
name = "paddle-paddle"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# External sources
paddlepaddle = { index = "paddle-paddle" }
torch = [{ index = "pytorch-cpu" }]

[dependency-groups]
dev = [
    "cryptography>=44.0.0",
    "djlint>=1.36.4",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "poethepoet>=0.34.0,<1.0.0",
    "pylint>=3.2.6,<4.0.0",
    "pyright>=1.1.376,<2.0.0",
    "ruff>=0.8.3,<1.0.0",
]
test = ["pytest>=9.0.2", "pytest-asyncio>=1.3.0", "pytest-dependency>=0.6.1"]

[tool.poe.tasks.clean]
cmd = "find . -type d \\( -name .ruff_cache -o -name __pycache__ -o -name .pytest_cache -o -name *.egg-info \\) -exec rm -rf {} +"
help = "Remove ruff, pytest, and Python cache directories - Use 'uv run poe clean' to execute"
