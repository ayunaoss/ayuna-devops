---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: uk8s-nfs-csi
provisioner: nfs.csi.k8s.io
parameters:
  server: uk8s-host.local
  share: /srv/nfs/uk8s
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
mountOptions:
  - hard
  - nfsvers=4.1

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uk8s-nfs-pvc
spec:
  storageClassName: uk8s-nfs-csi
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 512Mi
    limits:
      storage: 2Gi
